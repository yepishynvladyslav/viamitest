  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700"><defs><linearGradient id="sky" x2=".8" y2="1"><stop stop-color="${a[0]}"/><stop offset="1" stop-color="${a[1]}"/></linearGradient><linearGradient id="m" x2="1" y2="1"><stop stop-color="${a[2]}"/><stop offset="1" stop-color="${a[3]}"/></linearGradient></defs><rect width="900" height="700" fill="url(#sky)"/><circle cx="690" cy="165" r="67" fill="#fff3c4" opacity=".8"/><path d="M0 490 180 270 320 440 470 230 710 470 900 310 900 700 0 700Z" fill="${a[2]}"/><path d="m0 570 210-185 125 110 190-198 210 210 165-120v313H0Z" fill="url(#m)"/><path d="M0 630Q190 520 370 610T900 595V700H0Z" fill="${a[3]}" opacity=".9"/>${sea?'<path d="M0 540Q230 500 440 540T900 535V700H0Z" fill="#b5e0dc" opacity=".58"/><path d="M0 610q180-28 340 0t320 0 240 0" stroke="#ffffff99" stroke-width="8" fill="none"/>':''}${aurora?'<path d="M40 55Q300 250 720 10" stroke="#85f1c6" stroke-width="85" opacity=".33" fill="none"/>':''}<path d="M0 670Q200 620 380 665T900 642V700H0Z" fill="#193e3d" opacity=".38"/></svg>`;
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
}

function explore(){const list=filtered();return `<div class="container viewport fade-in"><div class="page-intro"><div><div class="eyebrow">EXPLORE THE WORLD</div><h1>Исследуй. Находи. Поезжай.</h1><p>Открытые поездки и попутчики. Находи людей, с которыми хочется увидеть мир.</p></div><button class="btn primary desktop-only" data-action="new-trip">${ico('plus')} Предложить поездку</button></div><div class="row" style="gap:8px"><form class="searchbar" style="flex:1" id="search-form">${ico('search')}<input name="query" value="${esc(filter.q)}" placeholder="Куда хочешь поехать?" autocomplete="off" aria-label="Поиск путешествий"><button type="submit" class="btn sm">Найти</button></form><button class="iconbtn" style="width:53px;height:53px;border:1px solid #e6ece8" data-action="filters" aria-label="Фильтры">${ico('filter')}</button></div><div class="filters-scroll">${['Все','Есть места','Авто','Избранное'].map(x=>`<button class="pill ${exploreTab===x?'active':''}" data-action="tab" data-value="${x}">${x==='Авто'?'🚗 Автопутешествия':x==='Избранное'?'♡ Избранное':x}</button>`).join('')}</div><div class="between mb14"><div class="small semibold">Найдено: ${list.length} ${list.length===1?'поездка':'поездок'}</div><button class="btn sm ghost" data-action="new-trip">${ico('plus')} Создать поездку</button></div>${list.length?`<div class="cat-grid">${list.map(t=>tripCard(t)).join('')}</div>`:`<div class="empty"><div class="empty-icon">${ico('compass')}</div><h3>Пока нет совпадений</h3><p>Попробуй изменить фильтры или создай своё предложение поездки.</p><button class="btn" data-action="reset-filters">Сбросить фильтры</button></div>`}<p class="notice mt24">Демо-каталог: объявления и участники вымышлены. Твои объявления сохраняются только в этом браузере.</p></div>`;}
function trips(){const stops=privateTrip.stops.concat(state.extraStops||[]);const count=state.visited.filter(x=>x.startsWith('myportugal:')).length;const pct=Math.round(count/stops.length*100);const custom=state.customTrips||[];return `<div class="container viewport fade-in"><div class="page-intro"><div><div class="eyebrow">YOUR TRAVEL SPACE</div><h1>Мои путешествия</h1><p>Маршруты, заметки и места — в одном пространстве.</p></div><button class="btn primary desktop-only" data-action="new-trip">${ico('plus')} Создать</button></div><div class="trip-summary"><div><span class="chip light">🇵🇹 Демо-поездка · Активная</span><h2>Португалия, встречай 🌊</h2><p>10–16 ноября · океан, пляжи и маленькие города</p></div><div><div class="between"><span class="small">${count} из ${stops.length} мест посещено</span><span class="small">${pct}%</span></div><div class="progress-line"><span style="width:${pct}%"></span></div><div class="trip-actions mt16"><button class="btn primary sm" data-action="start-day">${ico(state.startedAt?'check':'arrow')} ${state.startedAt?'День начат':'Начать день'}</button><button class="btn white sm" data-action="add-stop">${ico('plus')} Добавить точку</button><button class="btn white sm" data-action="chat" data-id="myportugal">${ico('message')} Чат</button></div></div></div><div class="section-head"><h2>Маршрут на карте</h2><span class="muted small">Интерактивное демо</span></div><div class="map-preview"><div class="map-dot" style="top:29%;left:24%"><span>1</span></div><div class="map-dot" style="top:57%;left:53%"><span>2</span></div><div class="map-dot" style="top:20%;left:73%"><span>3</span></div><div class="map-note">${ico('pin')} Португалия · маршрут</div></div><div class="section-head"><h2>Места в маршруте</h2><span class="muted small">${stops.length} остановок</span></div>${stops.map((s,i)=>{const done=state.visited.includes('myportugal:'+i);return `<div class="route-stop ${done?'done':''}"><div class="stop-indicator">${done?ico('check'):String(i+1).padStart(2,'0')}</div><div style="min-width:0;flex:1"><h4>${esc(s)}</h4><p>${done?('Посетил · '+(state.visitTimes['myportugal:'+i]||'время не указано')):'Запланированная остановка'} · ${i===0?'Лиссабон':'Португалия'}</p></div><button class="mark-btn" data-action="visit" data-id="${i}">${done?'✓ Посетил':'Посетил'}</button></div>`;}).join('')}<div class="section-head"><h2>Созданные мной предложения</h2><button class="textlink" data-action="new-trip">Создать ${ico('plus')}</button></div>${custom.length?`<div class="cat-grid">${custom.map(t=>tripCard(t)).join('')}</div>`:`<div class="empty"><div class="empty-icon">${ico('plus')}</div><h3>Всё впереди</h3><p>Создай открытое путешествие, опиши компанию, даты и бюджет. Предложение появится в каталоге.</p><button class="btn primary" data-action="new-trip">Предложить поездку</button></div>`}</div>`;}
function ai(){const alerts=state.flightAlerts||[];return `<div class="container viewport fade-in"><div class="page-intro"><div><div class="eyebrow">YOUR SMART TRAVEL COMPANION</div><h1>VIA — найди свой полёт</h1><p>Опиши поездку, а помощник поможет найти подходящие даты и длительность.</p></div></div><div class="ai-head"><div class="orb"></div><div class="eyebrow" style="color:var(--lime)">VIAMI INTELLIGENCE · CONCEPT</div><h1>Лови момент.<br>Не переплачивай.</h1><p>Планируй на 3 дня или на неделю. Ни один вариант не нарушит твои ограничения по датам.</p></div><div class="ai-grid"><form id="flight-form" class="card form-panel"><h3>✈️ Ищем подходящие даты</h3><p>Демо-алгоритм подбирает комбинации дат, а не настоящие авиабилеты.</p><div class="fields"><div class="field"><label>Откуда</label><input name="from" value="${esc(flightCriteria?.from||'Варшава')}" required></div><div class="field"><label>Куда</label><input name="to" value="${esc(flightCriteria?.to||'Барселона')}" required></div><div class="field"><label>Начало периода</label><input type="date" name="start" value="${flightCriteria?.start||'2026-12-01'}" required></div><div class="field"><label>Конец периода</label><input type="date" name="end" value="${flightCriteria?.end||'2027-02-28'}" required></div><div class="field"><label>Дней в поездке</label><input type="number" name="days" min="1" max="30" value="${flightCriteria?.days||3}" required></div><div class="field"><label>Допуск (± дней)</label><select name="tolerance">${[0,1,2].map(n=>`<option value="${n}" ${Number(flightCriteria?.tolerance??1)===n?'selected':''}>${n} ${n===0?'(строго)':''}</option>`).join('')}</select></div><div class="field"><label>Путешественников</label><input type="number" name="people" min="1" max="12" value="${flightCriteria?.people||2}" required></div><div class="field"><label>Бюджет на всех, zł</label><input type="number" name="budget" min="100" max="50000" value="${flightCriteria?.budget||2400}" required></div></div><div class="helper-box mt16">${ico('spark')} <span>Например: <strong>Варшава → Барселона, на 3 дня ±1 день, 2 человека.</strong> Продолжительность будет соблюдена программно.</span></div><button class="btn primary wide mt16" type="submit">Подобрать даты ${ico('arrow')}</button></form><div class="ai-aside"><div class="big-emoji">✈️</div><div><div class="eyebrow">THE BETTER WAY TO GO</div><h2>Лучший билет — тот, что подходит тебе.</h2><p>Позже подключим реальные провайдеры и мониторинг цен на сервере.</p></div><div class="example">«Хочу в Барселону зимой, нас двое, на 3 дня. Без двухнедельных поездок»</div></div></div>${flights.length?`<div class="section-head"><h2>Подходящие варианты</h2><span class="demo-ribbon">⚠ Условные цены · не реальные рейсы</span></div><div>${flights.map((f,i)=>`<div class="flight-result"><div><div class="mini-route">${esc(flightCriteria.from)} ${ico('plane')} ${esc(flightCriteria.to)}</div><p>✈ ${dateFmt(f.depart)} → ${dateFmt(f.return)} · ${f.days} ${f.days===1?'день':'дн.'} · ${flightCriteria.people} чел.<br>Условный маршрут · вариант №${i+1}</p></div><div class="cost"><strong>${money(f.total)}</strong><span>На всю группу · демо</span><button class="btn sm" data-action="save-flight" data-index="${i}">🔔 Следить*</button></div></div>`).join('')}</div><p class="notice">* Сохранённое наблюдение работает только как локальная запись. Настоящая фоновая проверка цен и уведомления ещё не подключены.</p>`:''}${alerts.length?`<div class="section-head"><h2>Сохранённые поиски</h2></div>${alerts.map((a,i)=>`<div class="ticket"><div><strong>✈ ${esc(a.from)} → ${esc(a.to)}</strong><p>${a.days} дн. · ${a.people} чел. · до ${money(a.budget)} · локальное демо</p></div><button class="btn sm danger" data-action="remove-alert" data-index="${i}">Удалить</button></div>`).join('')}`:''}</div>`;}
function detail(){const t=trip(activeTripId);if(!t)return explore();const mine=(state.customTrips||[]).some(x=>x.id===t.id);const applied=isApplied(t.id);return `<div class="container viewport fade-in"><div class="between mb14"><button class="textlink" data-nav="${detailFrom==='trips'?'trips':'explore'}">${ico('left')} Назад к путешествиям</button><span class="chip">Демо-предложение</span></div><div class="detail-hero"><img src="${t.image}" alt="${esc(t.city)}"><div class="overlay-bottom"><div class="caps" style="color:var(--lime)">${esc(t.country)} · ${esc(t.type)}</div><h1>${esc(t.title)}</h1><p>${ico('pin')} ${esc(t.from)} → ${esc(t.city)}</p></div></div><div class="detail-grid"><div><section class="card detail-info"><div class="between mb14"><h2>О путешествии</h2><span class="chip green">${t.capacity-t.members} свободных мест</span></div><p>${esc(t.desc)}</p><div class="separator"></div><h2>План поездки</h2>${(t.stops||[]).map((s,i)=>`<div class="route-stop"><div class="stop-indicator">0${i+1}</div><div><h4>${esc(s)}</h4><p>Запланированная остановка</p></div></div>`).join('')}<div class="separator"></div><h2>Детали</h2><div class="info-line"><span>Даты</span><strong>${shortDates(t)}</strong></div><div class="info-line"><span>Город выезда</span><strong>${esc(t.from)}</strong></div><div class="info-line"><span>Транспорт</span><strong>${esc(t.transport||'По договорённости')}</strong></div><div class="info-line"><span>Компания</span><strong>${t.members}/${t.capacity} чел.</strong></div>${t.transport==='Автомобиль'?`<div class="info-line"><span>Свободные места в авто</span><strong>${t.carSeats||0}</strong></div>`:''}<div class="info-line"><span>Даты утверждены</span><strong>После согласования группы</strong></div></section></div><aside class="card side-join"><span class="eyebrow">ПРИМЕРНЫЙ БЮДЖЕТ</span><div class="cost mt8">${money(t.budget)} <span>/ человек</span></div><p class="notice mt8">Сумма ориентировочная, не является офертой. Реальные платежи здесь не принимаются.</p><div class="separator"></div><div class="row"><span class="avatar one sm">${initials(t.host)}</span><div><strong class="small">${esc(t.host)}</strong><div class="tiny muted">Организатор · тестовый профиль</div></div></div><div class="mt12">${t.verified?'<span class="chip star">✓ Демо-статус организатора</span>':'<span class="chip">Без демонстрационной верификации</span>'}</div><div class="separator"></div><div class="row between mb14"><div class="avatar-stack"><span class="avatar sm one">А</span><span class="avatar sm two">М</span><span class="avatar sm three">В</span></div><span class="small muted">${t.members} из ${t.capacity} участников</span></div><button class="btn primary wide" data-action="join" data-id="${esc(t.id)}" ${applied||mine?'disabled':''}>${applied?'Заявка уже отправлена':mine?'Ваше предложение':'Хочу присоединиться'} ${ico('arrow')}</button><button class="btn ghost wide mt8" data-action="chat" data-id="${esc(t.id)}">${ico('message')} Открыть демо-чат</button>${applied?`<button class="btn outline wide mt8" data-action="confirm-trip" data-id="${esc(t.id)}">${(state.tripConfirmations||[]).includes(t.id)?'✓ Участие подтверждено':'Подтвердить участие (демо)'}</button>`:''}<p class="notice mt16">${mine?'Вы создатель этого объявления.':applied?'Заявка сохранена локально. Настоящий организатор её не получит.':'Заявка пока будет сохранена только на этом устройстве.'}</p></aside></div></div>`;}
function chat(){const t=trip(activeChat)||privateTrip;const messages=state.chatMessages[activeChat]||[];const voted=state.pollVotes[activeChat];return `<div class="container viewport fade-in"><div class="page-intro"><div><div class="eyebrow">GROUP CONVERSATION</div><h1>Чат поездки</h1><p>${esc(t.title)} · демонстрационная беседа, другие люди не получают сообщения.</p></div></div><div class="chat-layout"><section class="card chat-panel"><div class="between mb8"><div class="row"><span class="avatar two">${initials(t.host)}</span><div><strong class="small">${esc(t.title)}</strong><div class="tiny muted">${t.members} участников · локально</div></div></div><span class="chip green">Демо</span></div><div class="chat-scroll" id="chat-scroll">${messages.map(m=>`<div class="chat-bubble ${m.who==='Вы'?'own':''}"><span class="author">${esc(m.who)} · ${esc(m.at||'')}</span>${esc(m.text)}</div>`).join('')||'<div class="empty"><p>Пока нет сообщений. Начни обсуждение поездки.</p></div>'}</div><form id="chat-form" class="chat-send"><input name="message" placeholder="Написать сообщение…" required maxlength="600"><button type="submit" aria-label="Отправить">${ico('send')}</button></form></section><aside><div class="card detail-info"><h2>Голосование за даты</h2><p class="mb14">Обсудите, какой вариант подходит всем.</p>${['14–18 января','21–25 января','Гибкие даты'].map((c,i)=>`<button class="menu-row" data-action="vote" data-id="${activeChat}" data-option="${i}" style="padding:12px;border-radius:12px;margin-bottom:7px;border:1px solid #e8eee7"><span class="label">${esc(c)}</span>${Number(voted)===i?ico('check'):ico('chevron')}</button>`).join('')}<div class="helper-box mt16">${ico('shield')} <span>Условия считаются согласованными только после отдельного подтверждения всех участников. Здесь голосование локальное.</span></div></div><button class="btn ghost wide mt12" data-nav="support">${ico('message')} Нужна поддержка?</button></aside></div></div>`;}
function profile(){const a=state.account||{name:'Демо-гость',email:'Не указан',city:'Варшава'};return `<div class="container viewport fade-in"><div class="page-intro"><div><div class="eyebrow">YOUR TRAVEL IDENTITY</div><h1>Профиль путешественника</h1><p>Настройки профиля, безопасность и твои истории.</p></div></div><div class="card profile-header"><div class="profile-avatar">${initials(a.name)}</div><div style="flex:1;min-width:0"><h2>${esc(a.name)}</h2><p>${esc(a.city||'Город не указан')} · ${esc(a.email||'Демо-аккаунт')}</p><div class="mt8"><span class="chip">${a.demo?'Гостевой режим':'Локальный профиль'}</span> <span class="chip">Не верифицирован</span></div></div><button class="iconbtn" data-action="edit-profile" aria-label="Редактировать">${ico('settings')}</button></div><div class="stat-grid mt16"><div class="stat-box"><strong>1</strong><span>Поездка</span></div><div class="stat-box"><strong>${state.visited.filter(x=>x.startsWith('myportugal:')).length}</strong><span>Мест</span></div><div class="stat-box"><strong>${state.favorites.length}</strong><span>Избранное</span></div></div><div class="section-head"><h2>Мои возможности</h2></div><div class="card" style="overflow:hidden;box-shadow:none"><button class="menu-row" data-action="edit-profile"><span class="square">${ico('user')}</span><span class="label">Личные данные <span class="desc">Имя, город, возраст и необязательные сведения</span></span>${ico('chevron')}</button><button class="menu-row" data-action="verification"><span class="square">${ico('shield')}</span><span class="label">Подтверждение личности <span class="desc">Безопасная проверка через KYC в реальном продукте</span></span>${ico('chevron')}</button><button class="menu-row" data-nav="support"><span class="square">${ico('message')}</span><span class="label">Поддержка <span class="desc">Задать вопрос или сообщить о проблеме</span></span>${ico('chevron')}</button><button class="menu-row" data-nav="admin"><span class="square">${ico('lock')}</span><span class="label">Демо-панель администратора <span class="desc">Посмотреть концепцию управления и тикетов</span></span>${ico('chevron')}</button><button class="menu-row" data-action="about"><span class="square">${ico('globe')}</span><span class="label">О VIAMI TEST <span class="desc">Как работают данные и функции этого прототипа</span></span>${ico('chevron')}</button></div><button class="btn outline wide mt24" data-action="reset-demo">Сбросить демо и вернуться к началу</button></div>`;}
function support(){const msgs=state.supportMessages||[];return `<div class="container viewport fade-in"><div class="page-intro"><div><div class="eyebrow">WE'RE HERE TO HELP</div><h1>Поддержка VIAMI</h1><p>В демо сообщения сохраняются на устройстве. Реальные сотрудники их не получают.</p></div></div><div class="chat-layout"><section class="card chat-panel"><div class="between mb8"><div class="row"><span class="avatar" style="background:#d8edc0">V</span><div><strong>VIAMI Support</strong><p class="tiny muted">Демо-чат поддержки</p></div></div><span class="chip coral">Офлайн-демо</span></div><div class="chat-scroll" id="chat-scroll"><div class="chat-bubble"><span class="author">VIAMI · Приветствие</span>Привет! Опиши вопрос, и мы сохраним его в локальном демонстрационном центре поддержки.</div>${msgs.map(m=>`<div class="chat-bubble ${m.who==='Вы'?'own':''}"><span class="author">${esc(m.who)} · ${esc(m.at||'')}</span>${esc(m.text)}</div>`).join('')}</div><form id="support-form" class="chat-send"><input name="message" placeholder="Напиши вопрос…" required maxlength="1000"><button type="submit">${ico('send')}</button></form></section><aside class="card detail-info" style="height:fit-content"><h2>Что можно проверить?</h2><p>Отправь сообщение, затем открой демо-панель администратора в профиле — там появится обращение.</p><div class="helper-box mt16">${ico('shield')} <span>Это не канал связи с реальной поддержкой приложения. Настоящий backend пока не подключён.</span></div><button class="btn ghost wide mt16" data-nav="profile">Открыть профиль</button></aside></div></div>`;}
function admin(){return `<div class="container viewport fade-in"><div class="between"><div class="page-intro"><div><div class="eyebrow">ADMIN CONSOLE · LOCAL PREVIEW</div><h1>VIAMI Control Room</h1><p>Макет панели администратора. Роли и доступ к базе здесь не реализованы.</p></div></div><button class="btn ghost" data-nav="profile">${ico('left')} Профиль</button></div><div class="warning-card mb20">🔒 <strong>Важно:</strong> этот экран открыт для демонстрации функций. В рабочем VIAMI роль SUPER_ADMIN должна назначаться сервером по Firebase UID с MFA, не по email.</div><div class="admin-grid"><div class="admin-tile"><strong>${allTrips().length}</strong><span>Поездок в каталоге</span></div><div class="admin-tile"><strong>${state.joinRequests.length}</strong><span>Демо-заявок</span></div><div class="admin-tile"><strong>${state.supportMessages.filter(x=>x.who==='Вы').length}</strong><span>Сообщений поддержки</span></div><div class="admin-tile"><strong>${state.flightAlerts.length}</strong><span>Мониторингов (демо)</span></div></div><div class="section-head"><h2>Центр поддержки</h2><span class="chip">Тестовые данные</span></div>${(state.supportMessages||[]).filter(x=>x.who==='Вы').length?(state.supportMessages||[]).filter(x=>x.who==='Вы').map((m,i)=>`<div class="ticket"><div><strong>Обращение #${i+1}</strong><p>${esc(m.text)} · ${esc(m.at||'')}</p></div><button class="btn sm" data-action="reply-support">Ответить</button></div>`).join(''):`<div class="empty"><div class="empty-icon">${ico('message')}</div><h3>Входящие пусты</h3><p>Напиши что-нибудь через раздел «Поддержка», чтобы увидеть обращение здесь.</p><button class="btn" data-nav="support">Открыть поддержку</button></div>`}<div class="section-head"><h2>Опубликованные поездки</h2></div>${allTrips().slice(-5).map(t=>`<div class="ticket"><div><strong>${esc(t.title)}</strong><p>${esc(t.host)} · ${t.members}/${t.capacity} участников · ${money(t.budget)}</p></div><span class="chip">DEMO</span></div>`).join('')}</div>`;}
function render(){document.title='VIAMI TEST — '+({home:'Главная',explore:'Каталог',ai:'VIA AI',trips:'Маршруты',profile:'Профиль',detail:'Путешествие',chat:'Чат',support:'Поддержка',admin:'Админ'}[view]||'Путешествия');if(!state.account){app.innerHTML=welcome();return;}const pages={home,explore,trips,ai,detail,chat,profile,support,admin};app.innerHTML=`<div class="shell">${sidebar()}<main class="main-area">${header()}${(pages[view]||home)()}</main>${bottom()}</div>`;const chatScroll=document.getElementById('chat-scroll');if(chatScroll)chatScroll.scrollTop=chatScroll.scrollHeight;}
function authSheet(){sheet('Добро пожаловать в VIAMI',`<div class="helper-box">${ico('shield')}<span><strong>Рекомендуемая регистрация в релизе:</strong> Apple / Google / парольless email через Firebase Auth. Сейчас — только локальная демонстрация без настоящего подтверждения email.</span></div><div class="mt16 fields"><button type="button" class="btn ghost wide" data-action="auth-provider"> Продолжить с Apple</button><button type="button" class="btn ghost wide" data-action="auth-provider">G Продолжить с Google</button></div><div class="separator"></div><form id="signup-form"><div class="fields"><div class="field full"><label>Имя для профиля</label><input name="name" placeholder="Например, Влад" required minlength="2" maxlength="60" autocomplete="name"></div><div class="field full"><label>Email (демо, без отправки писем)</label><input name="email" type="email" placeholder="you@example.com" required autocomplete="email"></div><div class="field full"><label>Город</label><input name="city" value="Варшава" maxlength="70"></div></div><button class="btn primary wide mt16" type="submit">Создать локальный профиль ${ico('arrow')}</button></form><p class="sheet-note">Пароли и паспорта не запрашиваются. Профиль хранится только на этом устройстве. Для реального входа нужна серверная аутентификация.</p>`);}
function newTripSheet(){sheet('Предложить путешествие',`<p class="sheet-note">Создай поездку, в которую смогут записаться другие пользователи. В этом прототипе объявление видно только на твоём устройстве.</p><form id="new-trip-form"><div class="fields"><div class="field full"><label>Название поездки *</label><input name="title" placeholder="Лыжи в Словакии на выходных" minlength="6" maxlength="90" required></div><div class="field"><label>Страна *</label><input name="country" placeholder="Словакия" required maxlength="60"></div><div class="field"><label>Город / регион *</label><input name="city" placeholder="Татры" required maxlength="60"></div><div class="field"><label>Выезд из *</label><input name="from" placeholder="Варшава" required maxlength="60"></div><div class="field"><label>Транспорт</label><select name="transport"><option>Автомобиль</option><option>Самолёт</option><option>Поезд</option><option>Самостоятельно</option></select></div><div class="field"><label>Начало *</label><input name="start" type="date" min="2026-11-09" required value="2027-01-14"></div><div class="field"><label>Конец *</label><input name="end" type="date" min="2026-11-09" required value="2027-01-18"></div><div class="field"><label>Тип</label><select name="type"><option>Лыжи</option><option>Море</option><option>Горы</option><option>Город</option><option>Приключения</option></select></div><div class="field"><label>Бюджет на человека, zł *</label><input name="budget" type="number" value="1200" min="0" max="999999" required></div><div class="field"><label>Участников сейчас *</label><input name="members" type="number" value="2" min="1" max="30" required></div><div class="field"><label>Максимум участников *</label><input name="capacity" type="number" value="6" min="2" max="30" required></div><div class="field"><label>Свободно мест в автомобиле</label><input name="carSeats" type="number" min="0" max="8" value="2"></div><div class="field"><label>Описание *</label><textarea name="desc" required minlength="20" maxlength="1000" placeholder="Куда едете, какой план, что включено в бюджет, какие даты обсуждаются…"></textarea></div></div><div class="warning-card mt16">Это публичное демо-предложение без реальной публикации. Не указывай домашний адрес, данные паспорта или чужие номера телефонов.</div><button class="btn primary wide mt16" type="submit">Опубликовать демо-поездку ${ico('arrow')}</button></form>`);}
function filtersSheet(){sheet('Фильтры поездок',`<form id="filter-form"><div class="fields"><div class="field full"><label>Тип путешествия</label><select name="type">${['Все','Лыжи','Море','Горы','Город','Приключения'].map(x=>`<option ${filter.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Выезд из города</label><input name="from" value="${esc(filter.from)}" placeholder="Например, Варшава"></div><div class="field"><label>Бюджет до, zł</label><input name="maxBudget" type="number" min="0" max="100000" value="${filter.maxBudget}"></div><div class="field full"><label style="display:flex;align-items:center;gap:9px"><input style="width:19px;min-height:19px" name="verified" type="checkbox" ${filter.verified?'checked':''}> Только с демо-галочкой организатора</label></div></div><button class="btn primary wide mt16" type="submit">Показать предложения ${ico('arrow')}</button><button class="btn ghost wide mt8" type="button" data-action="reset-filters">Сбросить всё</button></form>`);}
function profileSheet(){const a=state.account;sheet('Редактировать профиль',`<form id="profile-form"><div class="fields"><div class="field full"><label>Имя</label><input name="name" value="${esc(a.name)}" minlength="2" maxlength="60" required></div><div class="field full"><label>Email (демо)</label><input value="${esc(a.email||'Не указан')}" readonly disabled></div><div class="field"><label>Город</label><input name="city" value="${esc(a.city||'')}" maxlength="70"></div><div class="field"><label>Возраст (18+ для открытых поездок)</label><input name="age" type="number" min="18" max="110" placeholder="Необязательно для демо" value="${esc(a.age||'')}"></div><div class="field full"><label>Пол (необязательно)</label><select name="gender"><option value="">Предпочитаю не указывать</option><option value="Женщина" ${a.gender==='Женщина'?'selected':''}>Женщина</option><option value="Мужчина" ${a.gender==='Мужчина'?'selected':''}>Мужчина</option><option value="Другое" ${a.gender==='Другое'?'selected':''}>Другое</option></select></div></div><p class="sheet-note">Данные видны только на устройстве и не подтверждены. В продукте дата рождения и возраст должны проверяться отдельно, если это требуется функцией.</p><button class="btn primary wide" type="submit">Сохранить изменения</button></form>`);}
function verificationSheet(){sheet('VIAMI Verified',`<div class="helper-box">${ico('shield')}<span><strong>Проверенная личность ≠ гарантия безопасной поездки.</strong> Значок будет показывать лишь результат конкретной проверки документов.</span></div><div class="mt16 help-tile">${ico('lock')}<div><strong>Как будет работать проверка</strong><p>1. Пользователь выбирает проверку. 2. Защищённый KYC-провайдер проверяет документ и лицо. 3. VIAMI получает минимальный необходимый результат.</p></div></div><div class="help-tile">${ico('shield')}<div><strong>Никаких паспортов в этом демо</strong><p>Сейчас не загружаем документы и не принимаем личную информацию. Для релиза нужен KYC-провайдер, политика хранения и юридическая проверка.</p></div></div><button class="btn ghost wide" data-action="close">Понятно</button>`);}
function aboutSheet(){sheet('О VIAMI TEST',`<div class="help-tile">${ico('compass')}<div><strong>Отдельный прототип</strong><p>VIAMI TEST не использует базу Firebase исходного VIAMI, не копирует личные переписки или данные пользователей. Это самостоятельная дизайн-концепция.</p></div></div><div class="help-tile">${ico('lock')}<div><strong>Как сохраняются данные</strong><p>Локальный браузерный storage: профиль, поездки, отметки, избранное, поиски, сообщения. Между телефонами не синхронизируются.</p></div></div><div class="help-tile">${ico('plane')}<div><strong>Поиск билетов</strong><p>Только симуляция комбинаций дат и стоимости, без проверок цен или настоящих авиабилетов. Мониторинг не работает в фоне.</p></div></div><button class="btn primary wide" data-action="close">Хорошо</button>`);}
function addStopSheet(){sheet('Новая остановка',`<form id="stop-form"><div class="field"><label>Место или заметка</label><input name="stop" placeholder="Например, пляж с красивым закатом" required minlength="3" maxlength="100"></div><button class="btn primary wide mt16" type="submit">Добавить в маршрут</button></form>`);}
function replySheet(){sheet('Ответить от VIAMI Support',`<form id="reply-form"><div class="field"><label>Сообщение пользователю (в этом же демо)</label><textarea name="reply" required minlength="2" placeholder="Здравствуйте! Мы получили обращение…"></textarea></div><button class="btn primary wide mt16" type="submit">Сохранить демо-ответ</button></form>`);}
function fromForm(f){return Object.fromEntries(new FormData(f).entries());}
function calcFlights(p){const day=86400000;const start=Date.parse(p.start+'T12:00:00Z'),end=Date.parse(p.end+'T12:00:00Z');const durations=[p.days,p.days+1,p.days-1,p.days+2,p.days-2].filter((d,i,a)=>d>=1&&Math.abs(d-p.days)<=p.tolerance&&a.indexOf(d)===i);const dates=[];for(let k=0;k<60&&dates.length<6;k++){const depart=start+k*day*3;const days=durations[k%durations.length]||p.days;const ret=depart+(days-1)*day;if(ret>end)break;const unit=[345,290,420,370,510,470][dates.length];const total=unit*p.people; if(total<=p.budget){dates.push({depart:new Date(depart).toISOString().slice(0,10),return:new Date(ret).toISOString().slice(0,10),days,total});}}return dates;}
function handleForm(e){const f=e.target;if(!f.id)return;e.preventDefault();const p=fromForm(f);switch(f.id){
 case 'signup-form':state.account={name:p.name.trim(),email:p.email.trim().toLowerCase(),city:p.city.trim(),demo:false};save();nav('home');toast('Профиль создан локально. Это не настоящая регистрация.');break;
 case 'search-form':filter.q=(p.query||'').trim();render();break;
 case 'filter-form':filter={...filter,type:p.type,from:(p.from||'').trim(),maxBudget:Number(p.maxBudget)||0,verified:!!p.verified};closeModal();render();break;
 case 'profile-form':state.account={...state.account,name:p.name.trim(),city:(p.city||'').trim(),age:p.age?Number(p.age):null,gender:p.gender||''};save();closeModal();render();toast('Профиль сохранён на устройстве');break;
 case 'new-trip-form':{const members=Number(p.members),capacity=Number(p.capacity);if(p.end<p.start){toast('Дата возвращения раньше даты выезда');return;}if(capacity<members){toast('Максимум участников не может быть меньше текущего количества');return;}const t={id:'mine'+Date.now().toString(36),title:p.title.trim(),country:p.country.trim(),city:p.city.trim(),from:p.from.trim(),start:p.start,end:p.end,type:p.type,transport:p.transport,budget:Number(p.budget),members,capacity,carSeats:p.transport==='Автомобиль'?Number(p.carSeats||0):0,verified:false,host:state.account.name,image:p.type==='Море'?photos.portugal:p.type==='Город'?photos.barcelona:photos.mountains,desc:p.desc.trim(),stops:[p.city.trim()]};state.customTrips.push(t);save();nav('explore');toast('Демо-поездка опубликована в локальном каталоге!');break;}
 case 'flight-form':{const params={...p,days:Number(p.days),tolerance:Number(p.tolerance),people:Number(p.people),budget:Number(p.budget)};if(params.end<params.start){toast('Конец периода должен быть после начала');return;}const daysBetween=Math.round((Date.parse(params.end+'T12:00:00Z')-Date.parse(params.start+'T12:00:00Z'))/86400000)+1;if(params.days-params.tolerance>daysBetween){toast('Период поиска слишком короткий для такой поездки');return;}if(params.people<1||params.people>12||params.days<1||params.days>30){toast('Проверь количество людей и дней');return;}flightCriteria=params;flights=calcFlights(params);render();toast(flights.length?'Симуляция: подобраны даты (без реальных цен)':'Нет условных вариантов: попробуй увеличить бюджет или период');break;}
 case 'chat-form':{const val=(p.message||'').trim();if(!val)return;(state.chatMessages[activeChat]??=[]).push({who:'Вы',text:val,at:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});save();render();break;}
 case 'support-form':{const val=(p.message||'').trim();if(!val)return;state.supportMessages.push({who:'Вы',text:val,at:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});save();render();toast('Обращение записано локально — в реальную поддержку не отправлено');break;}
 case 'reply-form':{const val=(p.reply||'').trim();if(!val)return;state.supportMessages.push({who:'VIAMI Support',text:val,at:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});save();closeModal();render();toast('Тестовый ответ добавлен');break;}
 case 'stop-form':{const val=(p.stop||'').trim();if(!val)return;state.extraStops.push(val);save();closeModal();render();toast('Остановка добавлена в демо-маршрут');break;}
 }}
function click(e){const el=e.target.closest('[data-action],[data-nav]');if(!el)return;if(el.closest('.modal-layer')&&el.dataset.action==='close-outside'&&e.target!==el)return;e.preventDefault();if(el.dataset.nav){nav(el.dataset.nav);return;}const id=el.dataset.id;switch(el.dataset.action){
 case 'start-demo':state.account={name:'Путешественник',email:'demo@local.invalid',city:'Варшава',demo:true};save();nav('home');break;
 case 'register':authSheet();break;
 case 'auth-provider':toast('Apple / Google: интерактивный макет. Настоящий OAuth будет в релизе.');break;
 case 'close':case 'close-outside':closeModal();break;
 case 'detail':detailFrom=view==='trips'?'trips':'explore';nav('detail',id);break;
 case 'new-trip':newTripSheet();break;
 case 'filters':filtersSheet();break;
 case 'reset-filters':filter={q:'',maxBudget:5000,type:'Все',from:'',verified:false};exploreTab='Все';closeModal();render();break;
 case 'tab':exploreTab=el.dataset.value;render();break;
 case 'favorite':{state.favorites=isFav(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render();toast(isFav(id)?'Добавлено в избранное':'Удалено из избранного');break;}
 case 'join':{const t=trip(id);if(!t)return;if(t.capacity<=t.members){toast('Свободных мест нет');return;}if(isApplied(id))return;state.joinRequests.push(id);save();render();toast('Демо-заявка сохранена. Её не получит реальный организатор.');break;}
 case 'confirm-trip':{const t=trip(id);if(!t)return;if(!(state.joinRequests||[]).includes(id)){toast('Сначала подай заявку на участие');return;}if(!state.tripConfirmations.includes(id)){state.tripConfirmations.push(id);save();toast('Участие подтверждено в демонстрации. Реального бронирования нет.');}else toast('Участие уже подтверждено');render();break;}
 case 'start-day':{if(!state.startedAt){state.startedAt=new Date().toISOString();save();toast('День запущен! Время сохранено локально.');}else toast('День уже запущен');render();break;}
 case 'visit':{const key='myportugal:'+id;if(state.visited.includes(key)){state.visited=state.visited.filter(x=>x!==key);delete state.visitTimes[key];}else{state.visited.push(key);state.visitTimes[key]=new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}save();render();toast(state.visited.includes(key)?'Отмечено как посещённое':'Отметка отменена');break;}
 case 'add-stop':addStopSheet();break;
 case 'chat':activeChat=id;nav('chat');break;
 case 'vote':state.pollVotes[id]=Number(el.dataset.option);save();render();toast('Твой выбор сохранён в демо');break;
 case 'save-flight':{const f=flights[Number(el.dataset.index)];if(!f)return;const a={...flightCriteria,exampleDeparture:f.depart,exampleReturn:f.return};state.flightAlerts.push(a);save();render();toast('Поиск сохранён локально. Фоновая проверка цен пока отсутствует.');break;}
 case 'remove-alert':state.flightAlerts.splice(Number(el.dataset.index),1);save();render();toast('Сохранённый поиск удалён');break;
 case 'edit-profile':profileSheet();break;
 case 'verification':verificationSheet();break;
 case 'about':aboutSheet();break;
 case 'reply-support':replySheet();break;
 case 'reset-demo':{sheet('Сбросить демо?',`<p class="sheet-note">Локально созданные поездки, сообщения, отметки, избранное и профиль будут удалены с этого устройства. Исходное приложение VIAMI не затрагивается.</p><button class="btn danger wide" data-action="confirm-reset">Удалить демо-данные</button><button class="btn ghost wide mt8" data-action="close">Отмена</button>`);break;}
 case 'confirm-reset':state=JSON.parse(JSON.stringify(emptyState));save();closeModal();view='home';render();toast('Локальные демо-данные сброшены');break;
 }}
document.addEventListener('click',click);document.addEventListener('submit',handleForm);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action][role="button"],[data-nav][role="button"]')){e.preventDefault();e.target.click();}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

</script>
